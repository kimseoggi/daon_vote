<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5b4bd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="다온이벤트 추첨">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<title>다온이벤트 추첨</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#202033;background:#f5f5fb}
*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 15px env(safe-area-inset-bottom);max-width:760px;margin-inline:auto}
header{padding:18px 2px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}.tag{font-size:12px;color:#777}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.panel{background:white;border:1px solid #e7e6f0;border-radius:14px;padding:13px}.stat{text-align:center}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:#777}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}button{border:0;border-radius:10px;background:#5b4bd8;color:white;font-weight:650;padding:12px;font-size:14px;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#efeff7;color:#333;border:1px solid #e0dfeb}.danger{background:#b53b49;color:white}.tab.active{background:#5b4bd8;color:white}
section{display:none}section.stack:not(.active){display:none}section.active{display:grid}.stack{display:grid;gap:11px}.row{display:flex;gap:8px}input,textarea{width:100%;min-width:0;border:1px solid #deddea;border-radius:9px;padding:12px;font:inherit;background:white;color:#222}textarea{resize:vertical}.row button{flex-shrink:0}
.muted{color:#777;font-size:12px}.people{display:grid;gap:7px}.personrow{display:flex;gap:7px;align-items:center}.personrow input{padding:7px 9px}.personrow button{padding:6px 10px;font-size:12px;white-space:nowrap;flex-shrink:0;line-height:1.2}.peoplegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pick{background:#f0effa;color:#302b54;border:1px solid #dfdcef;padding:10px 4px;overflow-wrap:anywhere}.pick small{display:block;color:#777;font-weight:400;margin-top:4px}.poolgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.dayhead{grid-column:1/-1;font-size:12px;font-weight:700;margin-top:6px;padding-bottom:3px;border-bottom:1px solid #e4e1f2}.dayhead:first-child{margin-top:0}.ticket{display:flex;align-items:center;justify-content:space-between;gap:2px;font-size:11px;padding:6px;background:#f7f6fc;border-radius:9px;overflow-wrap:anywhere}.ticket button{padding:4px 9px;background:#b53b49}
.center{text-align:center}.big{font-size:25px;font-weight:750}.hourglass{font-size:65px;animation:flip .65s infinite}@keyframes flip{50%{transform:rotate(180deg)}}
.progress{height:8px;background:#e8e7f0;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#5b4bd8;width:0;animation:fill 3s linear forwards}@keyframes fill{to{width:100%}}
.winner{display:flex;justify-content:space-between;align-items:center;font-size:18px}.winner b{color:#5b4bd8}.rankbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rankbtns button{padding:17px 6px;font-size:16px}
footer{padding:20px 2px;color:#888;font-size:11px;text-align:center}
@media(min-width:560px){.peoplegrid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>🎁 다온이벤트 추첨</h1><span class="tag">안드로이드 설치형</span></header>
<div class="stats"><div class="stat"><strong id="people-count">0</strong><span>회원명단</span></div><div class="stat"><strong id="pool-count">0</strong><span>응모권</span></div><div class="stat"><strong id="unique-count">0</strong><span>실제 인원</span></div></div>
<nav><button class="tab active" data-tab="names">명단 입력</button><button class="tab secondary" data-tab="pool">응모</button><button class="tab secondary" data-tab="draw">추첨 발표</button></nav>
<section id="names" class="active stack">
<b>회원 등록</b><div class="row"><input id="new-name" placeholder="회원 이름 입력"><button id="add-name">등록</button></div>
<div class="panel stack"><b>엑셀 명단 붙여넣기</b><span class="muted">엑셀 첫 번째 열을 복사해 붙여넣으세요.</span><textarea id="paste-names" rows="4" placeholder="홍길동&#10;김철수&#10;이영희"></textarea><span class="muted" id="paste-count">등록 예정 0명</span><div class="row"><button id="append-names">명단에 추가</button><button id="replace-names" class="danger">전체 교체</button></div></div>
<b>회원명단 <span class="muted" id="list-count"></span></b><div id="people-list" class="people"></div>
</section>
<section id="pool" class="stack">
<b>응모</b><span class="muted">이름을 누를 때마다 비프음이 나고 응모권이 1개 추가됩니다. 같은 사람을 여러 번 선택할 수 있습니다.</span><div id="people-grid" class="peoplegrid"></div>
<div class="row" style="justify-content:space-between"><b>응모자 풀</b><span class="muted" id="pool-label"></span></div><div id="pool-list" class="poolgrid"></div><button id="clear-pool" class="secondary">응모자 전체 비우기</button>
</section>
<section id="draw" class="stack">
<div class="panel center"><div class="big">행운의 주인공은?</div><div class="muted" id="draw-summary"></div></div>
<div id="animation" class="panel center" hidden><div class="hourglass">⏳</div><div class="big" id="countdown">3</div><b id="anim-title">행운의 주인공을 추첨하고 있습니다!</b><div class="progress"><div id="progress-bar"></div></div></div>
<div id="rank-buttons" class="rankbtns"><button data-rank="3">3등 추첨</button><button data-rank="2">2등 추첨</button><button data-rank="1">1등 추첨</button></div><div id="results" class="stack"></div><span class="muted">추첨 후에도 응모권은 유지됩니다.</span>
</section>
<div id="notice" class="muted" role="status" aria-live="polite"></div><footer>다온이벤트 추첨 · 기기 안에서 동작합니다</footer>
<script>
(()=>{
const $=id=>document.getElementById(id);let people=[],pool=[],winners={},drawTime='',drawing=false,nextId=1,nextTicket=1,timer=null,audio=null;
try{const saved=JSON.parse(localStorage.getItem('raffle-iphone-data')||'null');if(saved){people=saved.people||[];pool=saved.pool||[];winners=Array.isArray(saved.winners)?Object.fromEntries(saved.winners.map((w,i)=>[i+1,{person:w.person,time:saved.drawTime||''}])):(saved.winners||{});drawTime=saved.drawTime||'';nextId=saved.nextId||1;nextTicket=saved.nextTicket||1;}}catch(e){}
const count=id=>pool.filter(x=>x.person===id).length,unique=()=>new Set(pool.map(x=>x.person)).size;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=s=>$('notice').textContent=s;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayLabel=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'})};
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type='sine';o.frequency.setValueAtTime(880,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.14);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.15)}catch(e){}}
function fanfare(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=3000;f.connect(audio.destination);const t0=audio.currentTime+.05;[[523.25,0,.13],[523.25,.16,.13],[523.25,.32,.13],[659.25,.48,.3],[587.33,.84,.13],[659.25,1,.13],[783.99,1.16,.3],[523.25,1.55,1.3],[659.25,1.55,1.3],[783.99,1.55,1.3],[1046.5,1.55,1.3]].forEach(([fr,s,d])=>{const o=audio.createOscillator(),g=audio.createGain(),t=t0+s;o.type='sawtooth';o.frequency.setValueAtTime(fr,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.02);g.gain.setValueAtTime(.07,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(f);o.start(t);o.stop(t+d+.02)})}catch(e){}}
function stats(){updateRankButtons();$('people-count').textContent=people.length;$('pool-count').textContent=pool.length;$('unique-count').textContent=unique();$('list-count').textContent=people.length+'명';$('pool-label').textContent=pool.length+'개 응모권';$('draw-summary').textContent=`응모권 ${pool.length}개 · 실제 인원 ${unique()}명`;$('paste-count').textContent='등록 예정 '+parsePaste().length+'명'}
function parsePaste(){return $('paste-names').value.split(/\r?\n/).map(x=>x.split('\t')[0].trim()).filter(Boolean)}
function render(){try{localStorage.setItem('raffle-iphone-data',JSON.stringify({people,pool,winners,drawTime,nextId,nextTicket}))}catch(e){}stats();$('people-list').innerHTML=people.map((p,i)=>`<div class="personrow"><span class="muted">${i+1}.</span><input data-rename="${p.id}" value="${esc(p.name)}"><button class="danger" data-delete="${p.id}">삭제</button></div>`).join('');$('people-grid').innerHTML=people.map(p=>`<button class="pick" data-add="${p.id}">${esc(p.name)}<small>${count(p.id)}회 선택</small></button>`).join('');$('pool-list').innerHTML=(g=>Object.keys(g).sort((a,b)=>!a?1:!b?-1:b.localeCompare(a)).map(k=>`<div class="dayhead">${k?dayLabel(k):'날짜 없음'} · ${g[k].length}개</div>`+g[k].map(t=>{let p=people.find(x=>x.id===t.person);return `<div class="ticket"><b>${esc(p?.name||'회원')} ${t.number}</b><button data-ticket-delete="${t.id}">×</button></div>`}).join('')).join(''))(pool.reduce((a,t)=>((a[t.date||'']=a[t.date||'']||[]).push(t),a),{}))}
function addNames(list,replace){if(!list.length)return say('등록할 이름이 없습니다.');const fresh=list.map(name=>({id:nextId++,name}));if(replace){people=fresh;pool=[];winners={};drawTime=''}else people.push(...fresh);$('paste-names').value='';render();say(`${fresh.length}명을 등록했습니다.`)}
function addTicket(id){beep();const n=count(id)+1;pool.push({id:nextTicket++,person:id,number:n,date:today()});render();say(`${people.find(p=>p.id===id)?.name} 응모권 ${n}번 추가`)}
function removeTicket(id){pool=pool.filter(x=>x.id!==id);const c={};pool.forEach(x=>x.number=c[x.person]=(c[x.person]||0)+1);render()}
function tab(t){document.querySelectorAll('body section').forEach(s=>s.classList.toggle('active',s.id===t));document.querySelectorAll('.tab').forEach(b=>{let on=b.dataset.tab===t;b.classList.toggle('active',on);b.classList.toggle('secondary',!on)});if(t==='draw')showResults();render()}
function nextRank(){return [3,2,1].find(r=>!winners[r])||0}
function updateRankButtons(){const nr=nextRank();document.querySelectorAll('#rank-buttons button').forEach(b=>{const r=Number(b.dataset.rank);b.textContent=r+'등 추첨'+(winners[r]?' ✓':'');b.disabled=drawing||r!==nr})}
function showResults(){const rs=[1,2,3].filter(r=>winners[r]);if(!rs.length){$('results').innerHTML='';return}$('results').innerHTML='<b>🎉 축하합니다! 당첨자 발표</b>'+rs.map(r=>{const w=winners[r];return `<div class="panel winner"><b>${r}등</b><span style="text-align:right"><strong>${esc(people.find(p=>p.id===w.person)?.name||'회원')}</strong><br><small class="muted">📅 ${esc(w.time||'')}</small></span></div>`}).join('')+`<button id="clear-results" class="secondary">결과만 초기화 (응모권 유지)</button>`}
function startDraw(rank){if(drawing||rank!==nextRank())return;try{const C=window.AudioContext||window.webkitAudioContext;if(C){if(!audio)audio=new C();if(audio.state==='suspended')audio.resume()}}catch(e){}if(rank===3&&unique()<3)return say('서로 다른 응모자가 최소 3명 필요합니다.');const won=new Set(Object.values(winners).map(w=>w.person));const cand=pool.filter(x=>!won.has(x.person));if(!cand.length)return say('추첨 가능한 응모자가 없습니다.');const pick=cand[Math.floor(Math.random()*cand.length)];drawing=true;updateRankButtons();$('anim-title').textContent=rank+'등을 추첨하고 있습니다!';$('animation').hidden=false;let n=3;$('countdown').textContent=n;let bar=$('progress-bar');bar.style.animation='none';void bar.offsetWidth;bar.style.animation='fill 3s linear forwards';timer=setInterval(()=>{n--;if(n>0)$('countdown').textContent=n;else{clearInterval(timer);timer=null;drawing=false;winners[rank]={person:pick.person,time:new Date().toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})};$('animation').hidden=true;render();showResults();fanfare();say(rank+'등 추첨이 완료되었습니다. 응모권은 유지됩니다.')}},1000)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab)tab(b.dataset.tab);else if(b.id==='add-name'){let n=$('new-name').value.trim();if(n){people.push({id:nextId++,name:n});$('new-name').value='';render()}}else if(b.id==='append-names')addNames(parsePaste(),false);else if(b.id==='replace-names')addNames(parsePaste(),true);else if(b.id==='clear-pool'){pool=[];winners={};drawTime='';render();say('응모자를 비웠습니다.')}else if(b.dataset.rank)startDraw(Number(b.dataset.rank));else if(b.id==='clear-results'){winners={};drawTime='';render();showResults();say('결과만 초기화했습니다.')}else if(b.dataset.add)addTicket(Number(b.dataset.add));else if(b.dataset.ticketDelete)removeTicket(Number(b.dataset.ticketDelete));else if(b.dataset.delete){let id=Number(b.dataset.delete);people=people.filter(p=>p.id!==id);pool=pool.filter(x=>x.person!==id);winners={};drawTime='';render()}});
document.addEventListener('change',e=>{if(e.target.dataset.rename){let p=people.find(x=>x.id===Number(e.target.dataset.rename));if(p)p.name=e.target.value.trim()||p.name;render()}});
$('paste-names').addEventListener('input',stats);render();
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
